[package]
name = "nyxiontech-pdf-tools"
version = "1.1.0"
description = "Nyxiontech PDF Tools desktop app"
authors = ["Nyxiontech <https://nyxiontech.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/jurecki007/new-nyxiontech-tools"
homepage = "https://nyxiontech.com"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.1"
percent-encoding = "2.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
