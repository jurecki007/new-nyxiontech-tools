# cargo-about configuration: licences of the Rust crates compiled into the
# Windows desktop app. See CONTRIBUTING.md (Dependencies) for the command.
# Every licence accepted here must be compatible with the AGPL-3.0-or-later.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
# Skip our own crate (publish = false in Cargo.toml); it is AGPL-3.0-or-later.
private = { ignore = true }
