# Included in every location that sets its own headers (nginx does not inherit
# add_header into a location that has any add_header of its own).
#
# Everything the app loads comes from this origin. Extra permissions it needs:
#   'wasm-unsafe-eval'  WebAssembly (pdf.js, OCR, background removal)
#   worker-src blob:    HEIC decoder runs in a blob worker
#   data:/blob: URLs    images, fonts and generated files built in the browser
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; frame-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
