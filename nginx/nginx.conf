worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	# ES modules (ONNX Runtime) and WebAssembly must be served with these types
	types {
		application/javascript mjs;
		application/wasm wasm;
	}
	default_type application/octet-stream;

	sendfile on;
	server_tokens off;

	gzip on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm font/ttf;

	server {
		listen 80;
		server_name localhost;
		root /usr/share/nginx/html;
		index index.html;
		error_page 404 /404.html;
		# Relative Location headers, so redirects keep the port Docker maps (e.g. :8080).
		absolute_redirect off;

		# Hashed build output: safe to cache forever (without "always", so 404s are not cached)
		location /assets/ {
			include /etc/nginx/security-headers.conf;
			add_header Cache-Control "public, max-age=31536000, immutable";
			try_files $uri =404;
		}

		# OCR / ML assets (not hashed; change only with dependency updates)
		location /vendor/ {
			include /etc/nginx/security-headers.conf;
			add_header Cache-Control "public, max-age=604800";
			try_files $uri =404;
		}

		location = /health {
			default_type application/json;
			add_header Cache-Control "no-store, no-cache, must-revalidate" always;
			try_files /health.json =404;
		}

		location = /info {
			default_type application/json;
			add_header Cache-Control "no-store, no-cache, must-revalidate" always;
			try_files /info.json =404;
		}

		# Each tool has its own static page, like on Cloudflare Pages: /merge-pdf is
		# merge-pdf.html, /pl/ is pl/index.html. A trailing slash on a page is dropped
		# with a redirect; any other address is a real 404 (404.html).
		location / {
			include /etc/nginx/security-headers.conf;
			add_header Cache-Control "no-cache" always;
			try_files $uri $uri.html $uri/index.html @slash;
		}

		location @slash {
			rewrite ^(/.+)/$ $1 permanent;
			return 404;
		}

		location = /404.html {
			internal;
			include /etc/nginx/security-headers.conf;
			add_header Cache-Control "no-cache" always;
		}
	}
}
